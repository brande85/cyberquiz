<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEC+ Mission Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #070d1a;
  color: #c8d8f0;
  font-family: 'Exo 2', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 24px 16px 48px;
}

#app {
  width: 100%;
  max-width: 700px;
  background: #0a0f1e;
  border: 1px solid rgba(0,255,180,.12);
  border-radius: 8px;
  min-height: 600px;
  position: relative;
  overflow: hidden;
}

#app::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,200,.012) 2px, rgba(0,255,200,.012) 4px);
  pointer-events: none;
  z-index: 0;
}

.screen { position: relative; z-index: 1; padding: 24px; }

/* ── HUD ── */
.hud {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(0,255,180,.15);
}
.hud-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #00ffb4;
  flex-shrink: 0;
  animation: blink 2s infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }
.hud-title {
  font-family: 'Share Tech Mono', monospace;
  font-size: 12px;
  color: #00ffb4;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.hud-spacer { flex: 1; }
.hud-right {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  color: rgba(0,255,180,.5);
  letter-spacing: 1px;
}
.hud-timer { color: #ffd060; }

/* progress bar */
.progress-bar-wrap {
  height: 2px;
  background: rgba(0,255,180,.08);
  margin-bottom: 16px;
  border-radius: 1px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: #00ffb4;
  border-radius: 1px;
  transition: width .3s ease;
}

/* ── SECTION LABEL ── */
.section-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  color: rgba(200,216,240,.3);
  text-transform: uppercase;
  margin-bottom: 8px;
  margin-top: 16px;
}

/* ── STAT CARDS ── */
.dash-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 10px;
  margin-bottom: 18px;
}
.stat-card {
  background: rgba(0,255,180,.04);
  border: 1px solid rgba(0,255,180,.12);
  border-radius: 6px;
  padding: 14px 10px;
  text-align: center;
}
.stat-val {
  font-family: 'Share Tech Mono', monospace;
  font-size: 30px;
  color: #00ffb4;
  line-height: 1;
}
.stat-lbl {
  font-size: 10px;
  color: rgba(200,216,240,.4);
  margin-top: 5px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

/* ── HABIT TRACKER ── */
.habit-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 18px;
  padding: 10px 12px;
  background: rgba(0,255,180,.03);
  border: 1px solid rgba(0,255,180,.1);
  border-radius: 6px;
}
.habit-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: rgba(200,216,240,.3);
  letter-spacing: 1px;
  text-transform: uppercase;
  flex-shrink: 0;
  margin-right: 4px;
}
.habit-days { display: flex; gap: 6px; flex: 1; }
.habit-day {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.habit-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: rgba(200,216,240,.08);
  border: 1px solid rgba(200,216,240,.12);
  transition: all .3s;
}
.habit-dot.studied {
  background: rgba(0,255,180,.35);
  border-color: #00ffb4;
  box-shadow: 0 0 6px rgba(0,255,180,.3);
}
.habit-dot.today-studied {
  background: #00ffb4;
  border-color: #00ffb4;
  box-shadow: 0 0 10px rgba(0,255,180,.5);
}
.habit-dot.today-empty {
  background: rgba(200,216,240,.04);
  border-color: rgba(200,216,240,.25);
  border-style: dashed;
}
.habit-day-lbl {
  font-family: 'Share Tech Mono', monospace;
  font-size: 8px;
  color: rgba(200,216,240,.25);
  letter-spacing: .5px;
}

/* ── DOMAIN BARS ── */
.domain-list { display: flex; flex-direction: column; gap: 7px; margin-bottom: 18px; }
.domain-row { display: flex; align-items: center; gap: 8px; }
.domain-name {
  width: 180px;
  font-size: 11px;
  color: rgba(200,216,240,.6);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex-shrink: 0;
}
.domain-bar-bg {
  flex: 1;
  height: 5px;
  background: rgba(255,255,255,.06);
  border-radius: 3px;
  overflow: hidden;
}
.domain-bar { height: 100%; border-radius: 3px; transition: width .6s ease; }
.domain-pct {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  width: 32px;
  text-align: right;
  flex-shrink: 0;
}
.domain-count {
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px;
  color: rgba(0,255,180,.35);
  flex-shrink: 0;
  width: 24px;
  text-align: right;
}
.weak-tag {
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px;
  color: #ff9aaa;
  background: rgba(255,79,106,.1);
  border: 1px solid rgba(255,79,106,.2);
  padding: 1px 5px;
  border-radius: 2px;
  flex-shrink: 0;
}

/* ── BUTTONS ── */
.btn {
  background: transparent;
  border: 1px solid rgba(0,255,180,.3);
  color: #00ffb4;
  font-family: 'Share Tech Mono', monospace;
  font-size: 12px;
  letter-spacing: 1.5px;
  padding: 10px 18px;
  border-radius: 4px;
  cursor: pointer;
  transition: background .12s, border-color .12s, transform .08s;
  text-transform: uppercase;
  display: block;
  width: 100%;
  margin-bottom: 8px;
}
.btn:hover { background: rgba(0,255,180,.08); border-color: #00ffb4; }
.btn:active { transform: scale(.97); }
.btn-primary { background: rgba(0,255,180,.1); border-color: #00ffb4; font-size: 13px; padding: 13px; }
.btn-exam { border-color: rgba(255,208,96,.35); color: #ffd060; }
.btn-exam:hover { background: rgba(255,208,96,.08); border-color: #ffd060; }
.btn-review { border-color: rgba(100,150,220,.35); color: #6496dc; }
.btn-review:hover { background: rgba(100,150,220,.08); border-color: #6496dc; }
.btn-danger { border-color: rgba(255,79,106,.35); color: #ff6a80; }
.btn-danger:hover { background: rgba(255,79,106,.08); border-color: #ff6a80; }
.btn-small {
  width: auto;
  display: inline-block;
  padding: 5px 10px;
  font-size: 10px;
  letter-spacing: 1px;
  margin-bottom: 0;
}

/* ── SETUP ── */
.domain-option {
  background: rgba(255,255,255,.025);
  border: 1px solid rgba(200,216,240,.08);
  border-radius: 4px;
  padding: 9px 12px;
  cursor: pointer;
  font-size: 12px;
  color: rgba(200,216,240,.6);
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
  transition: all .1s;
  user-select: none;
}
.domain-option:hover { background: rgba(0,255,180,.04); border-color: rgba(0,255,180,.2); color: #c8d8f0; }
.domain-option.active { border-color: #00ffb4; color: #00ffb4; background: rgba(0,255,180,.06); }
.domain-option-right { display: flex; align-items: center; gap: 8px; }
.setup-count-tag {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: rgba(0,255,180,.4);
}
input[type=range] { width: 100%; accent-color: #00ffb4; margin-bottom: 12px; display: block; }

/* ── QUESTION ── */
.q-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.q-domain-badge {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: rgba(0,255,180,.5);
  background: rgba(0,255,180,.06);
  border: 1px solid rgba(0,255,180,.15);
  padding: 2px 8px;
  border-radius: 3px;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.q-type-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: rgba(200,216,240,.3);
  letter-spacing: 1px;
}
.q-text {
  font-size: 14px;
  line-height: 1.75;
  color: #dde8f8;
  margin-bottom: 16px;
  white-space: pre-wrap;
}

/* MC options */
.options { display: flex; flex-direction: column; gap: 7px; margin-bottom: 14px; }
.option {
  background: rgba(255,255,255,.025);
  border: 1px solid rgba(200,216,240,.1);
  border-radius: 5px;
  padding: 10px 13px;
  cursor: pointer;
  font-size: 13px;
  color: #c8d8f0;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  transition: background .1s, border-color .1s;
  line-height: 1.5;
  text-align: left;
}
.option:hover:not(.disabled) { background: rgba(0,255,180,.05); border-color: rgba(0,255,180,.25); }
.option.correct { border-color: #00ffb4; background: rgba(0,255,180,.1); color: #00ffb4; }
.option.incorrect { border-color: #ff4f6a; background: rgba(255,79,106,.07); color: #ff6a80; }
.option.exam-picked { border-color: rgba(200,216,240,.35); background: rgba(200,216,240,.05); }
.option.disabled { cursor: default; }
.option.eliminated { opacity: .35; cursor: default; text-decoration: line-through; }
.opt-key {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  background: rgba(255,255,255,.07);
  border-radius: 3px;
  padding: 2px 6px;
  flex-shrink: 0;
  margin-top: 1px;
}

/* FITB */
.fitb-sentence { font-size: 15px; line-height: 2; color: #dde8f8; margin-bottom: 14px; }
.fitb-blank {
  display: inline-block;
  min-width: 130px;
  border-bottom: 2px solid rgba(0,255,180,.35);
  padding: 0 8px;
  color: rgba(200,216,240,.35);
  font-family: 'Share Tech Mono', monospace;
  font-size: 13px;
  text-align: center;
  transition: color .2s, border-color .2s;
}
.chip-bank { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
.chip {
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(200,216,240,.14);
  border-radius: 4px;
  padding: 7px 13px;
  cursor: pointer;
  font-size: 13px;
  color: #c8d8f0;
  transition: all .1s;
  user-select: none;
}
.chip:hover:not(.disabled) { background: rgba(0,255,180,.07); border-color: rgba(0,255,180,.3); color: #00ffb4; }
.chip.correct { border-color: #00ffb4; background: rgba(0,255,180,.12); color: #00ffb4; }
.chip.incorrect { border-color: #ff4f6a; background: rgba(255,79,106,.08); color: #ff6a80; }
.chip.exam-picked { border-color: rgba(200,216,240,.35); background: rgba(200,216,240,.05); }
.chip.disabled { cursor: default; }

/* MATCHING */
.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 10px; }
.match-col { display: flex; flex-direction: column; gap: 6px; }
.match-left, .match-right {
  background: rgba(255,255,255,.025);
  border: 1px solid rgba(200,216,240,.1);
  border-radius: 4px;
  padding: 9px 11px;
  font-size: 12px;
  color: #c8d8f0;
  cursor: pointer;
  line-height: 1.4;
  transition: all .1s;
  user-select: none;
  min-height: 42px;
  display: flex;
  align-items: center;
}
.match-left:hover, .match-right:hover { background: rgba(0,255,180,.05); border-color: rgba(0,255,180,.22); }
.match-active { border-color: #00ffb4 !important; background: rgba(0,255,180,.1) !important; color: #00ffb4 !important; }
.match-paired { border-color: rgba(0,255,180,.3); background: rgba(0,255,180,.05); color: rgba(0,255,180,.7); }
.match-correct { border-color: #00ffb4 !important; background: rgba(0,255,180,.12) !important; color: #00ffb4 !important; }
.match-incorrect { border-color: #ff4f6a !important; background: rgba(255,79,106,.08) !important; color: #ff6a80 !important; }

/* SORTER */
.sort-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.sort-item {
  background: rgba(255,255,255,.025);
  border: 1px solid rgba(200,216,240,.1);
  border-radius: 4px;
  padding: 9px 11px;
  font-size: 12px;
  color: #c8d8f0;
  display: flex;
  align-items: center;
  gap: 8px;
  line-height: 1.4;
}
.sort-num { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: rgba(0,255,180,.45); flex-shrink: 0; width: 16px; }
.sort-text { flex: 1; }
.sort-arrows { display: flex; flex-direction: column; flex-shrink: 0; }
.sort-arrow { background: none; border: none; color: rgba(0,255,180,.4); cursor: pointer; font-size: 13px; padding: 1px 4px; line-height: 1; }
.sort-arrow:hover { color: #00ffb4; }
.sort-correct { border-color: #00ffb4 !important; background: rgba(0,255,180,.1) !important; color: #00ffb4 !important; }
.sort-correct .sort-num { color: #00ffb4; }
.sort-incorrect { border-color: #ff4f6a !important; background: rgba(255,79,106,.07) !important; color: #ff6a80 !important; }
.sort-incorrect .sort-num { color: #ff6a80; }

/* T/F */
.tf-btns { display: flex; gap: 10px; margin-bottom: 14px; }
.tf-btn {
  flex: 1;
  background: rgba(255,255,255,.025);
  border: 1px solid rgba(200,216,240,.12);
  border-radius: 5px;
  padding: 16px;
  cursor: pointer;
  font-family: 'Share Tech Mono', monospace;
  font-size: 16px;
  color: #c8d8f0;
  letter-spacing: 2px;
  text-transform: uppercase;
  transition: all .12s;
}
.tf-btn:hover:not(.disabled) { background: rgba(0,255,180,.06); border-color: rgba(0,255,180,.3); color: #00ffb4; }
.tf-btn.correct { border-color: #00ffb4; background: rgba(0,255,180,.12); color: #00ffb4; }
.tf-btn.incorrect { border-color: #ff4f6a; background: rgba(255,79,106,.08); color: #ff6a80; }
.tf-btn.tf-picked { border-color: rgba(200,216,240,.35); background: rgba(200,216,240,.05); }
.tf-btn.disabled { cursor: default; }
.tf-follow-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  letter-spacing: 1.5px;
  color: rgba(200,216,240,.35);
  text-transform: uppercase;
  margin-bottom: 7px;
}

/* PHISHING EMAIL */
.email-card {
  background: #0d1424;
  border: 1px solid rgba(200,216,240,.1);
  border-radius: 6px;
  margin-bottom: 14px;
  overflow: hidden;
}
.email-headers { padding: 11px 13px; border-bottom: 1px solid rgba(200,216,240,.07); }
.email-row { display: flex; gap: 8px; font-size: 12px; margin-bottom: 3px; }
.email-row:last-child { margin-bottom: 0; }
.email-field { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: rgba(200,216,240,.3); letter-spacing: 1px; width: 48px; flex-shrink: 0; padding-top: 1px; }
.email-from { color: #ff9aaa; }
.email-subject { font-size: 13px; font-weight: 500; color: #dde8f8; }
.email-body { padding: 13px; font-size: 12px; line-height: 1.75; color: #c8d8f0; white-space: pre-wrap; }

/* FEEDBACK */
.feedback {
  border-radius: 5px;
  padding: 11px 13px;
  font-size: 13px;
  line-height: 1.65;
  margin-bottom: 12px;
  display: none;
}
.feedback.correct { background: rgba(0,255,180,.07); border: 1px solid rgba(0,255,180,.2); color: #9fffd8; }
.feedback.incorrect { background: rgba(255,79,106,.06); border: 1px solid rgba(255,79,106,.2); color: #ff9aaa; }
.streak-flash {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  color: #ffd060;
  text-align: center;
  min-height: 18px;
  margin-bottom: 6px;
}

/* QUESTION TOOLBAR */
.q-toolbar { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
.q-toolbar .hud-spacer { flex: 1; }

/* RESULTS */
.results-score { text-align: center; padding: 26px 0 20px; }
.results-big { font-family: 'Share Tech Mono', monospace; font-size: 58px; line-height: 1; }
.results-sub { font-size: 11px; color: rgba(200,216,240,.4); letter-spacing: 2.5px; margin-top: 6px; text-transform: uppercase; }
.results-verdict { font-family: 'Share Tech Mono', monospace; font-size: 14px; margin-top: 8px; letter-spacing: 1px; }

/* MODAL */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(7,13,26,.9);
  display: flex; align-items: center; justify-content: center;
  z-index: 100; padding: 16px;
}
.modal-box {
  background: #0e1525;
  border: 1px solid rgba(0,255,180,.2);
  border-radius: 8px;
  padding: 22px;
  max-width: 400px;
  width: 100%;
  font-size: 13px;
  line-height: 1.65;
  color: #c8d8f0;
}
.modal-box h3 {
  font-family: 'Share Tech Mono', monospace;
  font-size: 12px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.modal-box h3.danger { color: #ff6a80; }
.modal-box h3.info { color: #00ffb4; }
.modal-actions { display: flex; gap: 8px; margin-top: 16px; }
.modal-actions .btn { flex: 1; margin: 0; }
.report-text {
  background: rgba(0,0,0,.3);
  border: 1px solid rgba(200,216,240,.1);
  border-radius: 4px;
  padding: 10px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  color: #c8d8f0;
  line-height: 1.6;
  word-break: break-word;
  margin: 10px 0;
  user-select: all;
}
.copy-confirm {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: #00ffb4;
  text-align: center;
  margin-top: 6px;
  min-height: 16px;
}
</style>
</head>
<body>
<div id="app"><div id="screen" class="screen"></div></div>
<script>
const QUESTIONS=[
  // ── THREATS ──
  {id:1,domain:'threats',q:'Which attack involves sending unsolicited messages to Bluetooth-enabled devices without prior pairing?',choices:['Bluejacking','Bluesnarfing','Evil twin','Replay attack'],exp:'Bluejacking sends unsolicited messages via Bluetooth. Bluesnarfing is unauthorized data theft — not messaging.'},
  {id:2,domain:'threats',q:'A user receives a convincing email from their bank asking them to verify account details. This is BEST described as:',choices:['Spear phishing','Vishing','Pharming','Whaling'],exp:'Spear phishing targets specific individuals with personalized, believable lures — often impersonating a trusted institution.'},
  {id:3,domain:'threats',q:'Which type of malware encrypts victim files and demands payment for the decryption key?',choices:['Ransomware','Rootkit','Trojan','Logic bomb'],exp:'Ransomware encrypts files and holds them hostage. Rootkits hide activity; Trojans disguise themselves as legitimate software.'},
  {id:4,domain:'threats',q:'An attacker floods a server with SYN packets but never completes the TCP handshake. This is a:',choices:['SYN flood','Smurf attack','Ping of death','Teardrop attack'],exp:'A SYN flood leaves half-open connections, exhausting server resources. The three-way handshake is never completed.'},
  {id:5,domain:'threats',q:'Which term describes exploiting a software vulnerability before any patch is available?',choices:['Zero-day','Privilege escalation','SQL injection','Buffer overflow'],exp:'Zero-day attacks target unknown or unpatched vulnerabilities — developers have zero days to fix the issue before exploitation.'},
  {id:6,domain:'threats',q:'A phishing campaign targeting senior executives specifically is known as:',choices:['Whaling','Spear phishing','Vishing','Smishing'],exp:'Whaling targets high-value executives. Spear phishing is personalized but not limited to executives.'},
  {id:7,domain:'threats',q:'Which vulnerability allows an attacker to inject malicious scripts into web pages viewed by other users?',choices:['Cross-site scripting (XSS)','SQL injection','CSRF','Directory traversal'],exp:'XSS injects client-side scripts into pages viewed by victims. SQL injection targets the database backend.'},
  {id:8,domain:'threats',q:'An attacker intercepts communications between two parties without their knowledge. This is called a:',choices:['Man-in-the-middle attack','Replay attack','Smurf attack','Watering hole attack'],exp:'A MitM attack positions the attacker between two communicating parties to intercept or alter traffic.'},
  {id:9,domain:'threats',q:'Which social engineering technique involves creating a fabricated scenario to manipulate a victim into divulging information?',choices:['Pretexting','Phishing','Tailgating','Vishing'],exp:'Pretexting creates a fabricated scenario to gain trust. Tailgating is physical access; vishing uses voice calls.'},
  {id:10,domain:'threats',q:'A rootkit is BEST described as:',choices:['Software designed to gain administrator-level access and hide its presence','Malware that replicates across networks','A program that displays unwanted advertisements','Malware triggered by a specific date or event'],exp:'Rootkits gain privileged access and conceal themselves from detection, often modifying the OS to remain hidden.'},
  {id:11,domain:'threats',q:'Which attack exploits trust relationships between websites to force a user\'s browser to make unwanted requests?',choices:['CSRF','XSS','Clickjacking','Session hijacking'],exp:'Cross-Site Request Forgery (CSRF) exploits the trust a site has in a user\'s browser, forcing authenticated requests without the user\'s knowledge.'},
  {id:12,domain:'threats',q:'An attacker compromises a website frequently visited by a target group. This is called a:',choices:['Watering hole attack','Drive-by download','Spear phishing','Typosquatting'],exp:'Watering hole attacks compromise sites the target audience visits, waiting for victims to come to them.'},
  {id:13,domain:'threats',q:'Which type of attack involves using previously captured authentication credentials to gain access later?',choices:['Replay attack','Brute force','Rainbow table','Credential stuffing'],exp:'A replay attack captures valid credentials or tokens and reuses them later.'},
  {id:14,domain:'threats',q:'A logic bomb is BEST described as malware that:',choices:['Triggers when a specific condition or event occurs','Spreads via email attachments','Encrypts files for ransom','Hides itself from the operating system'],exp:'Logic bombs lie dormant until a trigger condition is met — such as a specific date, user action, or system state.'},
  {id:15,domain:'threats',q:'Which attack sends specially crafted ICMP packets larger than the maximum allowable size to crash the target?',choices:['Ping of death','SYN flood','Smurf attack','Teardrop attack'],exp:'The Ping of Death sends oversized ICMP packets to crash or freeze the target system.'},
  {id:101,domain:'threats',q:'Which of the following measures is NOT commonly used to assess threat intelligence?',choices:['Detail','Timeliness','Accuracy','Relevance'],exp:'Timeliness, accuracy, and relevance are the common measures. Detail level is useful but not a standard assessment measure.'},
  {id:102,domain:'threats',q:'Which one of the following motivations is most commonly attributed to hacktivists?',choices:['Political/philosophical beliefs','War','Financial gain','Ethical'],exp:'Hacktivists are defined by advancing their political or philosophical beliefs through cyberattacks.'},
  {id:103,domain:'threats',q:'Which one of the following attackers is most likely to be associated with an APT?',choices:['Nation-state actor','Hacktivist','Unskilled','Insider'],exp:'Advanced persistent threats (APTs) are most commonly associated with nation-state actors who have the resources for long-term campaigns.'},
  {id:104,domain:'threats',q:'Which organization did the U.S. government help create to share knowledge between organizations in specific industry verticals?',choices:['ISACs','DHS','SANS','CERTS'],exp:'Information Sharing and Analysis Centers (ISACs) help infrastructure owners share threat information and provide tools to members.'},
  {id:105,domain:'threats',q:'Of common threat vectors, which one is most commonly exploited by remote attackers?',choices:['Email','Direct access','Wireless','Removable media'],exp:'Email is the most common threat vector exploited by remote attackers using phishing. The other vectors require physical proximity.'},
  {id:106,domain:'threats',q:'Which one of the following is the best example of a hacktivist group?',choices:['Anonymous','Chinese military','U.S. government','Russian mafia'],exp:'The Chinese military and U.S. government are nation-state APTs. Russian mafia is organized crime. Anonymous is the world\'s most prominent hacktivist group.'},
  {id:107,domain:'threats',q:'What type of assessment is particularly useful for identifying insider threats?',choices:['Behavioral','Instinctual','Habitual','IoC-based'],exp:'Behavioral assessments identify insider threats by examining context — after-hours logins, misuse of credentials, abnormal access patterns.'},
  {id:108,domain:'threats',q:'An attacker may have installed malicious firmware in a network device before it was delivered to the organization. What type of threat vector best describes this?',choices:['Supply chain','Removable media','Cloud','Direct access'],exp:'Tampering with equipment before it reaches the intended user is a supply chain threat.'},
  {id:109,domain:'threats',q:'Wendy is scanning cloud-based repositories for sensitive information. Which one should concern her most if discovered in a public repository?',choices:['API keys','Product manuals','Source code','Open source data'],exp:'API keys should NEVER be in public repositories because they may grant unauthorized individuals access to systems and data.'},
  {id:110,domain:'threats',q:'Vince received file hash values of malicious software that other firms found on compromised computers. What term best describes this information?',choices:['IoC','Vulnerability feed','TTP','RFC'],exp:'Specific details of attacks used to identify compromises are indicators of compromise (IoCs).'},
  {id:111,domain:'threats',q:'Ursula discovered that developers are using an unsanctioned cloud messaging tool. What term best describes this?',choices:['Shadow IT','System integration','Vendor management','Data exfiltration'],exp:'Using unapproved technology for business purposes is the classic definition of shadow IT.'},
  {id:112,domain:'threats',q:'Which of the following information sources would NOT be considered OSINT?',choices:['Port scans','DNS lookup','Search engine research','WHOIS queries'],exp:'Port scans are active reconnaissance — probing target systems — and would not be considered open source intelligence.'},
  {id:113,domain:'threats',q:'Edward Snowden, a government contractor, disclosed sensitive documents to journalists. Which term best describes Snowden\'s activities?',choices:['Insider','State actor','APT','Organized crime'],exp:'Snowden had authorized access and exploited it to make an unauthorized disclosure — the definition of an insider threat.'},
  {id:114,domain:'threats',q:'What type of malicious actor will typically have the least amount of resources?',choices:['Unskilled actor','Nation-states','Hacktivists','Organized crime'],exp:'Unskilled actors (script kiddies) are the least resourced. Resource order: nation-state > organized crime > hacktivists > insiders > unskilled.'},
  {id:115,domain:'threats',q:'What term describes intelligence gathered from publicly available sources?',choices:['OSINT','OPSEC','STIX','IntCon'],exp:'OSINT (open source intelligence) is gathered from public sources like search engines, websites, and domain registrars.'},
  {id:116,domain:'threats',q:'Patrick subscribed to a commercial threat feed only available to vetted, paying subscribers. What type of threat intelligence is this?',choices:['Proprietary threat intelligence','OSINT','ELINT','Corporate threat intelligence'],exp:'Proprietary (or closed) threat intelligence is not openly available. OSINT is freely available; ELINT is a military term for electronic intelligence.'},
  {id:120,domain:'threats',q:'Which of the following is NOT likely to be a useful IoC for a rootkit?',choices:['Pop-ups demanding a ransom','File hashes','Command and control domains','Behavior-based identifiers'],exp:'Rootkits are designed to be stealthy — ransomware pop-ups work against that. File hashes, C2 details, and behavioral identifiers are useful rootkit IoCs.'},
  {id:121,domain:'threats',q:'A staff member\'s credentials were used to change student grades. The staff member denies doing it. Which malware is most likely responsible?',choices:['A keylogger','A rootkit','Spyware','A logic bomb'],exp:'A keylogger captures credentials. A student could then use those credentials to make unauthorized changes.'},
  {id:122,domain:'threats',q:'Amanda notices traffic between her systems and a known malicious host on TCP port 6667. What is she most likely detecting?',choices:['Command and control','Spyware','A worm','A hijacked web browser'],exp:'Port 6667 is IRC — likely a botnet C2 channel. Spyware typically uses HTTP/HTTPS.'},
  {id:123,domain:'threats',q:'Mike discovers software on a company computer that allows attackers remote access to systems. How should he classify this?',choices:['A backdoor','A worm','Crypto malware','A Trojan'],exp:'Remote access to a system is provided by a backdoor. Backdoors may appear in firmware or hardware too.'},
  {id:124,domain:'threats',q:'Which of the following is NOT likely to be a characteristic used to identify a fileless malware attack?',choices:['Malicious executable files on disk','Unusual parent-child process relationships','Suspicious PowerShell activity','Abnormal processes connecting to external IPs'],exp:'Fileless malware operates in memory and does not write files to disk — file-based IoCs are not useful for detecting it.'},
  {id:125,domain:'threats',q:'Which type of malware is specifically designed to spread from system to system without requiring human interaction?',choices:['Worm','Virus','Trojan','Ransomware'],exp:'Worms self-replicate and spread without user interaction. Viruses require a host file; Trojans require users to execute them.'},
  {id:130,domain:'threats',q:'A penetration tester calls a staff member, introduces herself as IT support, and asks for personal details to verify her identity. What type of social engineering is this?',choices:['Pretexting','A watering hole attack','Phishing','Shoulder surfing'],exp:'Pretexting uses a false motive and lying to obtain information. The tester lied about her role to build trust before requesting personal information.'},
  {id:131,domain:'threats',q:'John discovers someone registered a domain spelled one letter differently from his company\'s domain and is using it as a phishing site. What is this attack?',choices:['Typosquatting','Session hijacking','Cross-site request forgery','Clickjacking'],exp:'Typosquatting registers a slightly misspelled domain hoping users mistype the real URL and land on the fake site.'},
  {id:132,domain:'threats',q:'Jen received an email asking for a payment method change from mike-smith@example.com, but she normally works with mike_smith@example.com. What type of attack is this?',choices:['Business email compromise','Vishing','Smishing','Pretexting'],exp:'Business email compromise (BEC) scams appear to come from legitimate sources and make requests like payment method changes.'},
  {id:133,domain:'threats',q:'Angela reviews authentication logs and sees attempts from many different accounts using the same small set of passwords. What is this technique called?',choices:['Password spraying','Brute forcing','Limited login attacks','Account spinning'],exp:'Password spraying tries a small list of common passwords across many accounts to avoid lockouts — different from brute force which hammers one account.'},
  {id:134,domain:'threats',q:'Andrea received a phone call claiming to be from her bank, asking for her account number and SSN to "validate her identity." What type of attack is this?',choices:['Brand impersonation','Smishing','A watering hole attack','A BEC attack'],exp:'When malicious actors claim to represent a legitimate organization, it is brand impersonation. This is also a vishing (voice phishing) attack.'},
  {id:135,domain:'threats',q:'Which human vectors are most likely to be part of a voice call-based attack?',choices:['Pretexting','A watering hole attack','Disinformation','BEC'],exp:'Pretexting and impersonation are common elements in voice call-based attacks. BEC requires email; watering holes leverage websites.'},
  {id:136,domain:'threats',q:'Annie\'s organization faces a social media campaign where bots are intentionally posting incorrect information about the company. What type of attack is this?',choices:['A disinformation campaign','A misinformation campaign','A pretexting campaign','An impersonation campaign'],exp:'Disinformation is intentionally false information spread with a goal. Misinformation is false information spread without malicious intent.'},
  {id:137,domain:'threats',q:'How is phishing different from general spam?',choices:['It is intended to acquire credentials or other data.','It is sent only to specific targeted individuals.','It is sent via SMS.','It includes malware in the message.'],exp:'Phishing is intended to acquire data, most often credentials. Spam is a broader term for unwanted email.'},
  {id:138,domain:'threats',q:'During a pen test, Angela wears a delivery service uniform and insists a C-level employee must personally sign for a package. What social engineering technique is this?',choices:['Impersonation','A watering hole attack','Whaling','Prepending'],exp:'Angela impersonated an actual delivery service employee to gain physical access to the company.'},
  {id:139,domain:'threats',q:'An attacker attempts passwords with a minor change each time against the same target. What type of attack is this?',choices:['Brute force','Dictionary','Rainbow table','Session hijacking'],exp:'Brute force tries every possible combination with small changes each time. Dictionary attacks use a predefined wordlist.'},
  {id:140,domain:'threats',q:'Jack purchases ads on a site frequently visited by his target organization\'s staff, then replaces the content with attack code. What type of attack is this?',choices:['A watering hole attack','A misinformation attack','A disinformation attack','A business website compromise'],exp:'Jack has attempted a watering hole attack — leveraging a frequently visited site to target a specific group.'},
  {id:141,domain:'threats',q:'A penetration tester receives insurance company staff emails about upcoming claim processes and uses them to craft highly relevant phishing emails. What type of attack is this?',choices:['Spear phishing','Whaling','Vishing','Smishing'],exp:'Spear phishing is targeted to a specific group. When it targets executives specifically, it is called whaling.'},
  {id:142,domain:'threats',q:'Postings from social media bots during an election campaign intentionally spread false narratives. This is an example of:',choices:['Disinformation','Impersonation','Asymmetric warfare','A watering hole attack'],exp:'Disinformation campaigns leverage bots and groups of posters to support ideas or beliefs that align with the campaign\'s goals.'},
  {id:143,domain:'threats',q:'What type of information is phishing NOT commonly intended to acquire?',choices:['Email addresses','Passwords','Credit card numbers','Personal information'],exp:'Phishing is not commonly used to acquire email addresses. It targets personal information, credentials, and financial data.'},
  {id:144,domain:'threats',q:'Coleen is a web admin. Some users report the site looks wrong, but she can visit it fine and finds no log of those users connecting. What might best explain this?',choices:['Typosquatting','SQL injection','Cross-site scripting','Cross-site request forgery'],exp:'The users are connecting to a fake server, not the real one — indicating typosquatting with a similar-looking domain.'},

  // ── ARCHITECTURE ──
  {id:16,domain:'architecture',q:'Which security concept ensures that no single person can complete a critical task alone?',choices:['Separation of duties','Least privilege','Defense in depth','Need to know'],exp:'Separation of duties splits critical tasks among multiple people to prevent fraud or error by any one individual.'},
  {id:17,domain:'architecture',q:'A DMZ is BEST described as:',choices:['A subnet separating internal and external networks for public-facing services','An encrypted VPN tunnel','A type of stateful firewall rule','A backup network segment'],exp:'A DMZ (Demilitarized Zone) hosts public-facing services while shielding the internal network.'},
  {id:18,domain:'architecture',q:'Which architecture model assumes no implicit trust and requires verification for every user and device?',choices:['Zero Trust','Defense in depth','Least privilege','Cloud-native'],exp:'Zero Trust operates on "never trust, always verify" — every request is authenticated regardless of network location.'},
  {id:19,domain:'architecture',q:'What does the principle of least privilege state?',choices:['Users receive the minimum access necessary for their role','All users share the same permissions','Administrators require unrestricted access','Permissions automatically expire after 30 days'],exp:'Least privilege limits access rights to the bare minimum needed to perform a job, reducing attack surface.'},
  {id:20,domain:'architecture',q:'Which cloud service model provides virtualized computing infrastructure over the internet?',choices:['IaaS','SaaS','PaaS','FaaS'],exp:'Infrastructure as a Service (IaaS) provides virtualized hardware. The customer manages the OS and above.'},
  {id:21,domain:'architecture',q:'Which concept involves layering multiple security controls so that if one fails, others remain in place?',choices:['Defense in depth','Zero Trust','Segmentation','Least privilege'],exp:'Defense in depth layers physical, technical, and administrative controls so no single point of failure compromises security.'},
  {id:22,domain:'architecture',q:'A honeynet is BEST described as:',choices:['A decoy network designed to lure and detect attackers','An encrypted private network','A network dedicated to backup storage','A software-defined perimeter'],exp:'A honeynet is a network of honeypots designed to attract attackers, study their behavior, and detect intrusions.'},
  {id:23,domain:'architecture',q:'Which type of virtualization allows multiple operating systems to share a single physical host?',choices:['Hypervisor-based virtualization','Containerization','Network virtualization','Storage virtualization'],exp:'Hypervisors (Type 1 or Type 2) allow multiple VMs with different OSes to run on one physical host, each isolated from the others.'},
  {id:24,domain:'architecture',q:'An air-gapped network is one that:',choices:['Is physically isolated from unsecured networks like the internet','Uses end-to-end encryption for all traffic','Requires multi-factor authentication for access','Is segmented by VLAN'],exp:'An air gap is a physical isolation technique — no network connection exists between the secured system and external networks.'},
  {id:25,domain:'architecture',q:'Which of the following BEST describes network segmentation?',choices:['Dividing a network into smaller isolated subnetworks','Encrypting all data in transit','Using a VPN for remote access','Implementing multi-factor authentication'],exp:'Network segmentation divides a network into zones, limiting lateral movement and containing breaches to smaller areas.'},

  {id:800,domain:'architecture',q:'Which type of firewall operates at the application layer and can inspect the content of HTTP traffic?',choices:['Web application firewall (WAF)','Packet filtering firewall','Stateful inspection firewall','Circuit-level gateway'],exp:'A WAF operates at Layer 7 and can inspect, filter, and block HTTP/S traffic based on content — protecting against XSS, SQLi, and similar web attacks.'},
  {id:801,domain:'architecture',q:'A jump server (bastion host) is BEST described as:',choices:['A hardened system used as a single access point to manage devices in a secure zone','A server that caches web content for faster delivery','A dedicated system for storing cryptographic keys','A server that performs load balancing across a network'],exp:'A bastion host is a hardened, purpose-built system that provides a single controlled entry point for administering systems in a protected network segment.'},
  {id:802,domain:'architecture',q:'Which cloud deployment model is exclusively operated for a single organization and may be hosted on-premises or by a third party?',choices:['Private cloud','Public cloud','Hybrid cloud','Community cloud'],exp:'A private cloud is dedicated to one organization, offering greater control and privacy. A public cloud is shared among many tenants.'},
  {id:803,domain:'architecture',q:'Which secure network design principle places the most critical and sensitive systems deepest within the network, requiring the most authentication and access control to reach?',choices:['Defense in depth','Zero Trust','Network segmentation','Least functionality'],exp:'Defense in depth places the most valuable assets behind multiple layers of security. An attacker must bypass each layer to reach the most protected systems.'},
  {id:804,domain:'architecture',q:'Which of the following BEST describes the shared responsibility model in cloud computing?',choices:['Security responsibilities are divided between the cloud provider and the customer based on the service model','The cloud provider is responsible for all security controls','The customer is responsible for all security controls','Security responsibilities are negotiated per contract'],exp:'In the shared responsibility model, the provider secures the underlying infrastructure while the customer is responsible for what they deploy on top of it — the split depends on whether it is IaaS, PaaS, or SaaS.'},
  {id:805,domain:'architecture',q:'Which technology allows multiple virtual networks to be created on top of a shared physical network infrastructure?',choices:['Software-defined networking (SDN)','Network address translation (NAT)','A content delivery network (CDN)','A demilitarized zone (DMZ)'],exp:'Software-defined networking decouples the control plane from the data plane, enabling flexible, programmable virtual network configurations on shared physical infrastructure.'},
  {id:806,domain:'architecture',q:'A company wants to ensure that all remote employees connect through a single encrypted tunnel before accessing internal resources. Which technology BEST meets this need?',choices:['VPN','VLAN','DMZ','Proxy server'],exp:'A VPN (Virtual Private Network) creates an encrypted tunnel between the remote user and the corporate network, ensuring all traffic is secured before reaching internal resources.'},

  // ── IMPLEMENTATION ──
  {id:26,domain:'implementation',q:'Which protocol provides secure remote login and is the standard replacement for Telnet?',choices:['SSH','FTP','RDP','SFTP'],exp:'SSH (Secure Shell) encrypts remote sessions end-to-end. Telnet transmits credentials in plaintext.'},
  {id:27,domain:'implementation',q:'WPA3 improves on WPA2 by implementing which feature for password-based authentication?',choices:['Simultaneous Authentication of Equals (SAE)','AES-256 encryption','TKIP','802.1X'],exp:'SAE replaces the WPA2 PSK handshake and is resistant to offline dictionary attacks even if the passphrase is weak.'},
  {id:28,domain:'implementation',q:'Which PKI component is responsible for issuing digital certificates?',choices:['Certificate Authority','Certificate Revocation List','Registration Authority','OCSP Responder'],exp:'The Certificate Authority (CA) signs and issues digital certificates. The RA handles identity verification before the CA issues.'},
  {id:29,domain:'implementation',q:'A hash function\'s collision resistance property means:',choices:['Two different inputs cannot produce the same hash output','The hash cannot be reversed','The hash length is fixed regardless of input size','The hash changes every time it is computed'],exp:'Collision resistance makes it computationally infeasible to find two distinct inputs that produce the same hash.'},
  {id:30,domain:'implementation',q:'Which type of encryption uses the same key for both encryption and decryption?',choices:['Symmetric','Asymmetric','Hashing','Elliptic curve'],exp:'Symmetric encryption uses one shared secret key. Asymmetric uses a public/private key pair. Hashing is one-way.'},
  {id:31,domain:'implementation',q:'HTTPS secures web traffic using which protocol?',choices:['TLS','SSH','IPSec','SFTP'],exp:'HTTPS uses TLS (Transport Layer Security) to encrypt HTTP traffic, ensuring confidentiality and integrity.'},
  {id:32,domain:'implementation',q:'Which port does HTTPS use by default?',choices:['443','80','22','8080'],exp:'HTTPS uses port 443 by default. HTTP uses port 80. SSH uses port 22.'},
  {id:33,domain:'implementation',q:'Which authentication factor is a fingerprint scan an example of?',choices:['Something you are','Something you know','Something you have','Somewhere you are'],exp:'Biometrics (fingerprints, retina scans, voice) are "something you are" — inherence factors.'},
  {id:34,domain:'implementation',q:'Which wireless attack creates a fraudulent access point mimicking a legitimate one to intercept traffic?',choices:['Evil twin','Bluejacking','Jamming','Deauthentication'],exp:'An evil twin AP impersonates a legitimate AP to perform MitM attacks on users who connect to it.'},
  {id:35,domain:'implementation',q:'Which algorithm is an example of asymmetric encryption?',choices:['RSA','AES','3DES','Blowfish'],exp:'RSA is asymmetric — it uses a public/private key pair. AES, 3DES, and Blowfish are all symmetric.'},
  {id:36,domain:'implementation',q:'What is the purpose of a digital signature?',choices:['To verify the identity of the sender and ensure message integrity','To encrypt data for confidentiality','To compress data before transmission','To establish a shared secret key'],exp:'Digital signatures use the sender\'s private key to sign data. The recipient uses the public key to verify authenticity and integrity.'},
  {id:37,domain:'implementation',q:'Which firewall type inspects packets and tracks the state of active connections?',choices:['Stateful inspection firewall','Packet filtering firewall','Application-layer firewall','Circuit-level gateway'],exp:'Stateful inspection firewalls track connection state tables and only allow packets that belong to established, known-good connections.'},
  {id:38,domain:'implementation',q:'A salt is added to passwords before hashing primarily to:',choices:['Prevent rainbow table attacks','Make the password longer','Encrypt the hash value','Speed up password verification'],exp:'A unique random salt defeats precomputed rainbow tables, since each hash is unique even for identical passwords.'},
  {id:39,domain:'implementation',q:'Which protocol is used to securely transfer files and uses port 22?',choices:['SFTP','FTP','FTPS','SCP'],exp:'SFTP (SSH File Transfer Protocol) runs over SSH on port 22. FTP uses port 21 and sends data in plaintext.'},
  {id:40,domain:'implementation',q:'Which type of certificate is used to secure multiple subdomains under a single domain?',choices:['Wildcard certificate','Self-signed certificate','Extended Validation (EV) certificate','Root certificate'],exp:'A wildcard certificate (e.g., *.example.com) secures the primary domain and all its first-level subdomains.'},
  {id:150,domain:'implementation',q:'What technology uses mathematical algorithms to render information unreadable to those lacking the required key?',choices:['Data encryption','Data loss prevention','Data obfuscation','Data minimization'],exp:'Encryption uses mathematical algorithms to protect information in transit and at rest. Without the decryption key, the data is unintelligible.'},
  {id:151,domain:'implementation',q:'What type of DLP technology would best protect against transmissions of sensitive information by guests on a wireless network?',choices:['Network-based','Watermarking','Pattern recognition','Host-based'],exp:'Network-based DLP must be used here. Host-based DLP requires agents, which would not be installed on guest systems.'},
  {id:152,domain:'implementation',q:'Alex has configured full-disk encryption for laptops issued to employees. What cybersecurity objective does this primarily support?',choices:['Confidentiality','Availability','Authenticity','Integrity'],exp:'Full-disk encryption primarily supports confidentiality by preventing unauthorized access to the drive if it is lost or stolen.'},
  {id:153,domain:'implementation',q:'Carol wants to obfuscate database data so she can refer to data elements without exposing the actual data. What obfuscation option should she select?',choices:['Tokenization','Encryption','Data masking','Data randomization'],exp:'Tokens replace data with a value linked specifically to the data, allowing it to be referenced without the actual field being exposed.'},
  {id:154,domain:'implementation',q:'Which one of the following data protection techniques is reversible when conducted properly?',choices:['Tokenization','Masking','Hashing','Shredding'],exp:'Tokenization uses a lookup table and is designed to be reversible. Hashing is one-way and shredding is permanent.'},
  {id:155,domain:'implementation',q:'Joanna is reviewing her account on an e-commerce website and sees her credit card number displayed as XXXX-XXXX-XXXX-1234. What type of data obfuscation is in use?',choices:['Data masking','Hashing','Field encryption','Tokenization'],exp:'Data masking conceals elements of a data field, preventing full exposure while leaving the field accessible in the database.'},
  {id:156,domain:'implementation',q:'Henry accesses a database server from his workstation. What data state best describes the data when it is on the network?',choices:['Data in transit','Data at rest','Data on the wire','Data in use'],exp:'When data is transferred over the network, it is data in transit. When stored on drives, it is data at rest. When actively processed, it is data in use.'},

  // ── OPERATIONS ──
  {id:41,domain:'operations',q:'Which incident response phase involves collecting and preserving evidence for potential legal proceedings?',choices:['Forensics/Evidence collection','Containment','Eradication','Recovery'],exp:'Forensic evidence collection preserves chain of custody. It must be handled carefully to ensure admissibility in legal proceedings.'},
  {id:42,domain:'operations',q:'A security analyst notices unusual outbound traffic at 2 AM from an internal server. Which tool BEST helps identify and alert on this?',choices:['SIEM','Antivirus','Patch management system','Password manager'],exp:'A SIEM (Security Information and Event Management) aggregates logs across the environment and alerts on anomalous patterns.'},
  {id:43,domain:'operations',q:'Which backup strategy backs up only the data changed since the last FULL backup?',choices:['Differential backup','Full backup','Incremental backup','Snapshot backup'],exp:'Differential backups copy everything changed since the last full backup. Incremental only copies changes since the last backup of any type.'},
  {id:44,domain:'operations',q:'What is the correct order of the incident response phases?',choices:['Identify → Contain → Eradicate → Recover → Lessons Learned','Contain → Identify → Eradicate → Recover → Lessons Learned','Identify → Eradicate → Contain → Recover → Lessons Learned','Prepare → Detect → Respond → Contain → Eradicate'],exp:'The standard IR lifecycle: Preparation → Identification → Containment → Eradication → Recovery → Lessons Learned.'},
  {id:45,domain:'operations',q:'Which document defines recovery time and recovery point objectives for disaster recovery?',choices:['BCP/DRP','AUP','SLA','NDA'],exp:'Business Continuity Plans and Disaster Recovery Plans define RTO (how fast to recover) and RPO (acceptable data loss).'},
  {id:46,domain:'operations',q:'Which type of scan detects vulnerabilities without attempting to exploit them?',choices:['Vulnerability scan','Penetration test','Active scan','Credentialed scan'],exp:'Vulnerability scans identify potential weaknesses without exploiting them. Penetration tests actually attempt exploitation.'},
  {id:47,domain:'operations',q:'A chain of custody document is MOST important during which phase of incident response?',choices:['Forensics/Evidence collection','Preparation','Containment','Recovery'],exp:'Chain of custody documentation tracks who handled evidence and when, ensuring integrity and legal admissibility.'},
  {id:48,domain:'operations',q:'Which type of analysis examines malware behavior without executing it?',choices:['Static analysis','Dynamic analysis','Fuzzing','Sandboxing'],exp:'Static analysis examines malware code without running it. Dynamic analysis executes it in a safe environment to observe behavior.'},
  {id:49,domain:'operations',q:'What does RTO stand for in disaster recovery planning?',choices:['Recovery Time Objective','Restore Technology Option','Real-Time Operations','Recovery Transfer Order'],exp:'Recovery Time Objective (RTO) defines the maximum acceptable downtime after an incident before normal operations must be restored.'},
  {id:50,domain:'operations',q:'Which tool captures and analyzes network packets in real time?',choices:['Protocol analyzer (e.g. Wireshark)','SIEM','IDS','Vulnerability scanner'],exp:'Protocol analyzers like Wireshark capture raw network packets. A SIEM correlates log events; an IDS detects attack patterns.'},
  {id:200,domain:'operations',q:'Which security assessment technique assumes that an organization has already been compromised and searches for evidence of that compromise?',choices:['Threat hunting','Penetration testing','Vulnerability scanning','War driving'],exp:'Threat hunting makes an assumption of compromise and searches for indicators that confirm it.'},
  {id:201,domain:'operations',q:'Renee is configuring credentialed scans of servers. What type of account should she provide to the scanner?',choices:['Read-only','Domain administrator','Local administrator','Root'],exp:'Credentialed scans only require read-only access. This follows the principle of least privilege.'},
  {id:202,domain:'operations',q:'Ryan is planning to conduct a vulnerability scan of a business-critical system using dangerous plug-ins. What would be the best approach for the initial scan?',choices:['Run the scan in a test environment.','Run the scan against production systems.','Run the scan during business hours.','Do not run the scan at all.'],exp:'Ryan should first run his scan against a test environment to identify likely vulnerabilities and assess whether the scan might disrupt business activities.'},
  {id:203,domain:'operations',q:'Tara found that a vulnerability reported by a scanner did not exist because the system was actually patched. What type of error occurred?',choices:['False positive','False negative','True positive','True negative'],exp:'A false positive error occurs when the vulnerability scanner reports a vulnerability that does not actually exist.'},
  {id:204,domain:'operations',q:'During a penetration test, Patrick deploys a toolkit on a compromised system and uses it to gain access to other systems on the same network. What term best describes this?',choices:['Lateral movement','Privilege escalation','Footprinting','OSINT'],exp:'Moving from one compromised system to other systems on the same network is known as lateral movement.'},
  {id:205,domain:'operations',q:'Zian is coordinating a security audit to validate the organization\'s financial statements to investors. What term best describes this audit?',choices:['External audit','Internal audit','Penetration test','Informal audit'],exp:'Audits that validate financial statements for investors are performed by independent third-party auditors — external audits.'},
  {id:206,domain:'operations',q:'Which tool is most likely to detect an XSS vulnerability?',choices:['Web application vulnerability scanner','Static application test','Intrusion detection system','Network vulnerability scanner'],exp:'An IDS detects attacks, not vulnerabilities. A web application vulnerability scanner is specifically designed to test web applications for issues like XSS.'},
  {id:207,domain:'operations',q:'During a vulnerability scan, Brian discovered a critical missing SMBv1 patch (MS17-010). What security control, if deployed, would likely have addressed this issue?',choices:['Patch Management','File integrity monitoring','Intrusion detection','Threat hunting'],exp:'This vulnerability is corrected by a Microsoft patch from 2017. A strong patch management program would have identified and remediated the missing patch.'},
  {id:208,domain:'operations',q:'What type of control is Jeff implementing when he designs a backup methodology to allow quick restoration after a ransomware attack?',choices:['Corrective','Preventive','Detective','Deterrent'],exp:'Corrective controls remediate security issues that have already occurred. Restoring backups after a ransomware attack is a corrective control.'},

  // ── GOVERNANCE ──
  {id:51,domain:'governance',q:'Which US regulation governs the protection of patient health information?',choices:['HIPAA','GDPR','PCI-DSS','SOX'],exp:'HIPAA (Health Insurance Portability and Accountability Act) protects patient health information. GDPR covers EU data; PCI-DSS covers payment cards.'},
  {id:52,domain:'governance',q:'A risk assessment finds a risk with low likelihood but catastrophic impact. The organization should PRIMARILY:',choices:['Mitigate the risk','Accept the risk','Avoid the risk','Transfer the risk'],exp:'Catastrophic-impact risks warrant mitigation regardless of low likelihood.'},
  {id:53,domain:'governance',q:'Which document defines the acceptable use of an organization\'s IT resources by employees?',choices:['AUP','SLA','NDA','BCP'],exp:'An Acceptable Use Policy (AUP) defines permitted and prohibited uses of organizational systems and resources.'},
  {id:54,domain:'governance',q:'Which regulation requires organizations that process EU citizens\' personal data to comply with strict data protection rules?',choices:['GDPR','HIPAA','SOX','FERPA'],exp:'GDPR (General Data Protection Regulation) applies to any organization processing EU residents\' personal data, regardless of location.'},
  {id:55,domain:'governance',q:'Which risk response strategy involves purchasing insurance to offset potential losses?',choices:['Risk transference','Risk avoidance','Risk mitigation','Risk acceptance'],exp:'Risk transference shifts financial impact to a third party, typically through insurance or contractual agreements.'},
  {id:56,domain:'governance',q:'A quantitative risk assessment expresses risk in terms of:',choices:['Monetary values and probabilities','Categories such as high, medium, and low','Color-coded risk matrices','Qualitative likelihood ratings'],exp:'Quantitative assessments assign numerical monetary values to risk — for example, Annual Loss Expectancy (ALE) calculations.'},
  {id:57,domain:'governance',q:'Which framework is widely used for IT security and risk management and was developed by NIST?',choices:['NIST CSF','ISO 27001','COBIT','PCI-DSS'],exp:'The NIST Cybersecurity Framework (CSF) organizes cybersecurity around five functions: Identify, Protect, Detect, Respond, Recover.'},
  {id:58,domain:'governance',q:'A penetration test that begins with no prior knowledge of the target environment is called a:',choices:['Black-box test','White-box test','Gray-box test','Red team exercise'],exp:'Black-box testing simulates an external attacker with no insider knowledge. White-box provides full system information to the tester.'},
  {id:59,domain:'governance',q:'Which policy specifies the minimum security requirements that systems must meet before connecting to the network?',choices:['Baseline security policy','AUP','Data classification policy','Change management policy'],exp:'A baseline security policy defines the minimum-security configuration standard all systems must meet.'},
  {id:60,domain:'governance',q:'What does data classification help an organization determine?',choices:['Which data requires what level of protection based on sensitivity','How to encrypt all data at rest','How long to retain all records','Who is permitted to install software'],exp:'Data classification categorizes data by sensitivity to apply appropriate controls and handling procedures.'},
  {id:300,domain:'governance',q:'Matt is updating the organization\'s threat assessment process. What category of control is Matt implementing?',choices:['Managerial','Operational','Technical','Corrective'],exp:'Managerial controls are procedural mechanisms that focus on the mechanics of the risk management process. Threat assessment is one example.'},
  {id:301,domain:'governance',q:'What term best describes an organization\'s desired security state?',choices:['Control objectives','Security priorities','Strategic goals','Best practices'],exp:'Control objectives are statements of a desired security state — expressing the level of protection required to preserve CIA of information and systems.'},
  {id:302,domain:'governance',q:'Greg discovered that the organization does not use full-disk encryption on laptops. What type of control gap exists?',choices:['Preventive','Detective','Corrective','Deterrent'],exp:'Full-disk encryption is intended to prevent a security incident if a device is lost or stolen — a preventive control gap.'},
  {id:303,domain:'governance',q:'What compliance regulation most directly affects the operations of a health-care provider?',choices:['HIPAA','PCI DSS','GLBA','SOX'],exp:'HIPAA provides direct regulations for the security and privacy of protected health information and has the most direct impact on a health-care provider.'},
  {id:304,domain:'governance',q:'Jade\'s organization suffered a breach and her primary concern is sanctions for violating PCI DSS. What category of risk is this?',choices:['Compliance','Strategic','Reputational','Operational'],exp:'Jade\'s primary concern is violating a specific regulation (PCI DSS), making this a compliance risk.'},
  {id:305,domain:'governance',q:'Tony believes a compromise of his file server could reveal information that would prevent the company from continuing to do business. What term best describes this risk?',choices:['Strategic','Reputational','Financial','Operational'],exp:'Tony\'s primary concern is that the company may no longer be able to do business — a strategic risk.'},
  {id:306,domain:'governance',q:'What process reviews control objectives for an organization to determine if controls do not meet those objectives?',choices:['Gap analysis','Penetration test','Boolean analysis','Risk analysis'],exp:'A gap analysis determines whether controls meet control objectives for a service, organization, or system.'},
  {id:307,domain:'governance',q:'Tina is tuning her organization\'s intrusion prevention system to prevent false positive alerts. What type of control is Tina implementing?',choices:['Technical control','Physical control','Managerial control','Operational control'],exp:'Technical controls enforce CIA in the digital space. Examples include firewall rules, access control lists, intrusion prevention systems, and encryption.'},
  {id:308,domain:'governance',q:'What type of control is a policy or procedure?',choices:['Directive','Corrective','Detective','Preventive'],exp:'Policies and procedures are directive controls that inform employees of what they should do to achieve security objectives.'},
  {id:309,domain:'governance',q:'Ben has deployed a DLP tool that flags sensitive data before emails are sent outside the organization. What control type best describes this?',choices:['Preventive','Managerial','Detective','Corrective'],exp:'This is a preventive control intended to stop sensitive data from leaving the organization.'},
  {id:310,domain:'governance',q:'Frank configures an ACL to ensure only specific IP addresses can connect to a service. What type of control has he deployed?',choices:['Technical','Managerial','Physical','Operational'],exp:'Access control lists are technical controls. Managerial controls are procedural; physical controls impact the physical world.'},
  {id:311,domain:'governance',q:'Lou mounted a "Beware of Dog" sign on the fence surrounding his datacenter. No actual dog is present. What control type best describes this?',choices:['Deterrent','Compensating','Detective','Physical'],exp:'The sign only has value as a deterrent control — it may discourage attackers. Be careful on exam questions to note whether it\'s a real dog or just a sign.'},
  {id:312,domain:'governance',q:'Alice places a firewall between a vulnerable embedded device and the rest of the network because no patch exists. What type of control has Alice deployed?',choices:['Compensating','Directive','Detective','Procedural'],exp:'Alice deployed a compensating control — a workaround used when standard controls like patching are not possible.'},
  {id:313,domain:'governance',q:'Kolin is a penetration tester hired by a healthcare system to conduct a penetration test. What term best describes Kolin\'s work?',choices:['Authorized attacker','Unauthorized attacker','Unknown attacker','Semi-authorized attacker'],exp:'Attacks conducted as part of an authorized penetration test are white-hat hacking attacks, regardless of whether done internally or by an external firm.'},
  {id:314,domain:'governance',q:'Nolan is writing an after-action report on a breach where attackers stole thousands of customer records. What cybersecurity principle was most impacted?',choices:['Confidentiality','Availability','Nonrepudiation','Integrity'],exp:'The disclosure of sensitive information to unauthorized individuals is a violation of the principle of confidentiality.'},
  {id:315,domain:'governance',q:'Which one of the following objectives is NOT one of the three main objectives of information security?',choices:['Nonrepudiation','Integrity','Availability','Confidentiality'],exp:'The three primary objectives are confidentiality, integrity, and availability (CIA). Nonrepudiation is important but not part of the core CIA triad.'},
  {id:316,domain:'governance',q:'Joanna\'s organization has a policy that requires a user\'s account to be immediately locked if determined to have been phished. What type of control is this policy?',choices:['Directive','Detective','Preventive','Compensating'],exp:'Policies and procedures are directive controls. This could also be considered corrective, but directive is the more precise answer for a written policy.'},

const ALL_Q = [...QUESTIONS, ...FITB_QUESTIONS, ...MATCH_QUESTIONS, ...SORT_QUESTIONS, ...TF_QUESTIONS, ...PHISH_QUESTIONS];

// ── STATE ──
function defaultState() {

}
function loadState() { try { const s = localStorage.getItem(STORAGE_KEY); return s ? JSON.parse(s) : null; } catch { return null; } }
function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {} }

// ── UTILITIES ──
function pct(c,t) { return t === 0 ? 0 : Math.round((c/t)*100); }
function shuffle(a) { const b=[...a]; for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]; } return b; }
function render(html) { document.getElementById('screen').innerHTML = html; }
function qs(sel) { return document.querySelector(sel); }
function qsa(sel) { return document.querySelectorAll(sel); }

function weakDomains() {
  return DOMAINS.filter(d => {
    const s = state.domainStats[d.id];
    return s.total >= 3 && pct(s.correct, s.total) < 60;
  }).map(d => d.id);
}

function domainQCount(id) { return ALL_Q.filter(q => q.domain === id).length; }

// ── HABIT TRACKER ──
function getWeekDays() {
  const today = new Date();
  const dow = today.getDay(); // 0=Sun
  const monday = new Date(today);
  monday.setDate(today.getDate() - (dow === 0 ? 6 : dow - 1));
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    days.push(d);
  }
  return days;
}

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
}

function markStudiedToday() {
  const key = todayKey();
  if (!state.studyLog.includes(key)) {
    state.studyLog.push(key);
    if (state.studyLog.length > 90) state.studyLog = state.studyLog.slice(-90);
    saveState();
  }
}

function habitTrackerHTML() {
  const days = getWeekDays();
  const labels = ['M','T','W','T','F','S','S'];
  const todayD = new Date();
  const todayStr = todayKey();

  const dotsHTML = days.map((d, i) => {
    const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    const isToday = key === todayStr;
    const studied = state.studyLog.includes(key);
    const isPast = d < todayD && !isToday;
    let cls = 'habit-dot';
    if (isToday && studied) cls += ' today-studied';
    else if (isToday && !studied) cls += ' today-empty';
    else if (studied) cls += ' studied';
    return `<div class="habit-day"><div class="${cls}"></div><div class="habit-day-lbl">${labels[i]}</div></div>`;
  }).join('');

  return `<div class="habit-wrap"><div class="habit-label">This week</div><div class="habit-days">${dotsHTML}</div></div>`;
}

// ── BUILD QUEUE ──
function buildQueue(mode) {
  const weak = weakDomains();
  const pool = ALL_Q.filter(q => session.domains.includes(q.domain));
  const limit = Math.min(session.count, pool.length);

  function scoreQ(q) {
    let w = 1;
    if (weak.includes(q.domain)) w += 2;
    const hist = state.history.filter(h => h.id === q.id);
    if (hist.length === 0) w += 1;
    else { const cr = hist.filter(h => h.correct).length; if (cr/hist.length < 0.5) w += 2; }
    return w;
  }

  function pickFrom(arr, used, n) {
    const avail = arr.filter(q => !used.has(q.id));
    const picked = [];
    for (let i = 0; i < n && avail.length > 0; i++) {
      const totalW = avail.reduce((s,q) => s + scoreQ(q), 0);
      if (totalW === 0) break;
      let r = Math.random() * totalW;
      for (let j = 0; j < avail.length; j++) {
        r -= scoreQ(avail[j]);
        if (r <= 0) { picked.push(avail[j]); used.add(avail[j].id); avail.splice(j,1); break; }
      }
    }
    return picked;
  }

  const used = new Set();
  const selected = [];

  if (mode === 'exam') {
    // Proportional by domain weight, target 90 questions
    const target = 90;
    DOMAINS.forEach(d => {
      const n = Math.round(target * d.weight / 100);
      const domPool = ALL_Q.filter(q => q.domain === d.id);
      selected.push(...pickFrom(domPool, used, n));
    });
    // Top up to 90
    while (selected.length < target) {
      const rem = ALL_Q.filter(q => !used.has(q.id));
      if (!rem.length) break;
      const picks = pickFrom(rem, used, target - selected.length);
      selected.push(...picks);
    }
    return shuffle(selected).slice(0, target);
  }

  if (mode === 'review') {
    const missed = ALL_Q.filter(q => state.missedIds.includes(q.id));
    return shuffle(missed);
  }

  // Practice: 70% MC, 30% alt types
  const byType = { mc:[], fitb:[], match:[], sort:[], tf:[], phish:[] };
  pool.forEach(q => { const t = q.type || 'mc'; if (byType[t]) byType[t].push(q); });

  const mcTarget = Math.round(limit * 0.70);
  const altTarget = limit - mcTarget;
  const altTypes = ['fitb','match','sort','tf','phish'].filter(t => byType[t].length > 0);
  const perAlt = altTypes.length > 0 ? Math.ceil(altTarget / altTypes.length) : 0;

  altTypes.forEach(t => selected.push(...pickFrom(byType[t], used, perAlt)));
  selected.push(...pickFrom(byType['mc'], used, limit - selected.length));

  if (selected.length < limit) {
    selected.push(...pickFrom(pool.filter(q => !used.has(q.id)), used, limit - selected.length));
  }

  return shuffle(selected).slice(0, limit);
}

// ── DASHBOARD ──
function showDashboard() {
  const weak = weakDomains();
  const op = pct(state.totalCorrect, state.totalAnswered);

  const domainRows = DOMAINS.map(d => {

    const qc = domainQCount(d.id);
    return `<div class="domain-row">
      <span class="domain-name" title="${d.name}">${d.name}</span>
      <div class="domain-bar-bg"><div class="domain-bar" style="width:${s.total?p:0}%;background:${color}"></div></div>
      <span class="domain-pct" style="color:${color}">${s.total ? p+'%' : '--'}</span>
      <span class="domain-count">${qc}q</span>
      ${weak.includes(d.id) ? '<span class="weak-tag">WEAK</span>' : ''}
    </div>`;
  }).join('');

  const missedBtn = state.missedIds.length > 0
    ? `<button class="btn btn-review" onclick="startReview()">[ REVIEW MISSED — ${state.missedIds.length} ]</button>`
    : '';
  const resetBtn = state.totalAnswered > 0
    ? `<button class="btn btn-danger" onclick="confirmReset()">[ RESET ALL PROGRESS ]</button>`
    : '';

  render(`
    <div class="hud">
      <div class="hud-dot"></div>
      <div class="hud-title">SEC+ Mission Control</div>
    </div>
    ${habitTrackerHTML()}
    <div class="dash-grid">
      <div class="stat-card"><div class="stat-val">${op}<span style="font-size:20px">%</span></div><div class="stat-lbl">Accuracy</div></div>
      <div class="stat-card"><div class="stat-val">${state.totalAnswered}</div><div class="stat-lbl">Answered</div></div>
    </div>
    <div class="section-label">Domain Performance</div>
    <div class="domain-list">${domainRows}</div>
    <div style="font-family:'Share Tech Mono',monospace;font-size:10px;color:rgba(200,216,240,.2);text-align:center;margin-bottom:14px">${ALL_Q.length} questions in bank</div>
    <button class="btn btn-primary" onclick="showSetup()">[ START SESSION ]</button>
    <button class="btn btn-exam" onclick="startExam()">[ EXAM SIMULATION — 90Q ]</button>
    ${missedBtn}
    ${resetBtn}
  `);
}

// ── SETUP ──
function showSetup() {
  const weak = weakDomains();
  const domOpts = DOMAINS.map(d => {
    const sel = session.domains.includes(d.id);
    const isW = weak.includes(d.id);
    const qc = domainQCount(d.id);

      <span>${d.name}</span>

  }).join('');

  render(`
    <div class="hud">
      <div class="hud-dot"></div>
      <div class="hud-title">Configure Session</div>
      <div class="hud-spacer"></div>
